<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div style="padding-top: 40px; text-align: center; padding-bottom: 20px">
      <h1 class="h1-title" style="font-weight: bold">Contact Us</h1>
      <p class="p-body-text-gray" style="margin-top: 10px">
        <a th:href="@{/homepage}" style="text-decoration: none; color: inherit"
          >Home</a
        >
        /
        <span style="color: black; font-weight: 600">Contact Us</span>
      </p>
    </div>

    <div class="content-width">
      <div class="main_container" style="align-items: stretch; gap: 30px">
        <div style="flex: 1; width: 100%">
          <div
            class="image-wrap"
            style="
              width: 100%;
              height: auto;
              margin-top: 0;
              border-radius: 15px;
              box-shadow: none;
            "
          >
            <img
              th:src="@{/images/contact.jpg}"
              alt="Car Background"
              class="image"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 15px;
              "
            />
          </div>
        </div>
      </div>

      <div
        style="
          display: flex;
          flex-wrap: wrap;
          gap: 30px;
          margin-top: 40px;
          margin-bottom: 80px;
          justify-content: space-between;
          align-items: center;
          padding: 0 10px;
        "
      >
        <div style="display: flex; align-items: center; gap: 15px">
          <div class="homepage-info-banner">
            <div
              class="tab-icon-wrapper"
              style="
                padding: 14px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <img
                <img
                th:src="@{/icons/homepage/location-pin-svgrepo-com.svg}"
                alt="Location"
                style="
                  width: 24px;
                  height: 24px;
                  object-fit: contain;
                  filter: brightness(0) invert(1);
                "
              />
            </div>
          </div>
          <div>
            <p
              class="p-body-text-gray"
              style="font-size: 12px; margin-bottom: 2px"
            >
              Address
            </p>
            <p class="h3-title" style="font-weight: bold; font-size: 15px">
              Oxford Ave. Cary, NC 27511
            </p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px">
          <div class="homepage-info-banner">
            <div
              class="tab-icon-wrapper"
              style="
                padding: 14px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <img
                th:src="@{/icons/footer/mail-alt-3-svgrepo-com.svg}"
                alt="Email"
                style="
                  width: 24px;
                  height: 24px;
                  object-fit: contain;
                  filter: brightness(0) invert(1);
                "
              />
            </div>
          </div>
          <div>
            <p
              class="p-body-text-gray"
              style="font-size: 12px; margin-bottom: 2px"
            >
              Email
            </p>
            <p class="h3-title" style="font-weight: bold; font-size: 15px">
              nwiger@yahoo.com
            </p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px">
          <div class="homepage-info-banner">
            <div
              class="tab-icon-wrapper"
              style="
                padding: 14px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <img
                th:src="@{/icons/footer/call-svgrepo-com.svg}"
                alt="Phone"
                style="
                  width: 24px;
                  height: 24px;
                  object-fit: contain;
                  filter: brightness(0) invert(1);
                "
              />
            </div>
          </div>
          <div>
            <p
              class="p-body-text-gray"
              style="font-size: 12px; margin-bottom: 2px"
            >
              Phone
            </p>
            <p class="h3-title" style="font-weight: bold; font-size: 15px">
              +537 547-6401
            </p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px">
          <div class="homepage-info-banner">
            <div
              class="tab-icon-wrapper"
              style="
                padding: 14px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <img
                src="./icons/homepage/calendar.svg"
                alt="Clock"
                style="
                  width: 24px;
                  height: 24px;
                  object-fit: contain;
                  filter: brightness(0) invert(1);
                "
              />
            </div>
          </div>
          <div>
            <p
              class="p-body-text-gray"
              style="font-size: 12px; margin-bottom: 2px"
            >
              Opening hours
            </p>
            <p class="h3-title" style="font-weight: bold; font-size: 15px">
              Sun-Mon: 10am - 10pm
            </p>
          </div>
        </div>
      </div>

      <div style="margin-bottom: 100px">
        <h2
          class="h2-title"
          style="text-align: center; margin-bottom: 50px; font-weight: bold"
        >
          Latest blog posts & news
        </h2>

        <div class="homepage-car-gallery-block">
          <div class="car-gallery-wrapper">
            <div style="display: flex; flex-direction: column; gap: 15px">
              <div
                class="image-wrap"
                style="
                  aspect-ratio: 16/10;
                  margin-top: 0;
                  border-radius: 15px;
                  box-shadow: none;
                "
              >
                <img
                  th:src="@{/images/key.jpg}"
                  class="image"
                  style="border-radius: 15px"
                  alt="Blog"
                />
              </div>
              <div>
                <h3
                  class="h3-title"
                  style="font-weight: bold; margin-bottom: 8px"
                >
                  How To Choose The Right Car
                </h3>
                <p class="p-body-text-gray" style="font-size: 12px">
                  News / 12 April 2024
                </p>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px">
              <div
                class="image-wrap"
                style="
                  aspect-ratio: 16/10;
                  margin-top: 0;
                  border-radius: 15px;
                  box-shadow: none;
                "
              >
                <img
                  th:src="@{/images/Honda.jpg}"
                  class="image"
                  style="border-radius: 15px"
                  alt="Blog"
                />
              </div>
              <div>
                <h3
                  class="h3-title"
                  style="font-weight: bold; margin-bottom: 8px"
                >
                  Which plan is right for me?
                </h3>
                <p class="p-body-text-gray" style="font-size: 12px">
                  News / 12 April 2024
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
  </body>
</html>
