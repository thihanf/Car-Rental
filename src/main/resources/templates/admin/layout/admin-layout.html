<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>

    <!-- ✅ Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- ✅ Your Admin Styles -->
    <link rel="stylesheet" th:href="@{/assets/admin/css/admin.css}" />
  </head>

  <body>
    <div class="admin-layout">
      <aside th:replace="~{admin/layout/sidebar :: sidebar}"></aside>

      <div class="admin-main">
        <header th:replace="~{admin/layout/navbar :: navbar}"></header>

        <main class="admin-content">
          <div th:replace="${content}"></div>
        </main>

        <footer th:replace="~{admin/layout/footer :: footer}"></footer>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--  Admin JS -->
    <script th:src="@{/assets/admin/js/admin.js}"></script>
  </body>
</html>
