<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/admin-layout :: layout(~{::section})}"
>
  <section>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <div
      class="container-fluid py-4 px-4"
      style="background-color: #f8f9fa; min-height: 100vh"
    >
      <h3 class="fw-bold mb-4">Dashboard</h3>

      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div
            class="card border-0 shadow-sm p-4 rounded-4"
            style="background-color: #ddefe0"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="mb-1 small fw-medium">Total Revenues</p>
                <h4
                  class="fw-bold mb-0"
                  th:text="'Rs ' + ${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 2, 'POINT')}"
                >
                  Rs 0.00
                </h4>
              </div>
              <i class="bi bi-wallet2 fs-4"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div
            class="card border-0 shadow-sm p-4 rounded-4"
            style="background-color: #f4ecdd"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="mb-1 small fw-medium">Total Bookings</p>
                <h4 class="fw-bold mb-0" th:text="${totalBookings}">0</h4>
              </div>
              <i class="bi bi-tags fs-4"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div
            class="card border-0 shadow-sm p-4 rounded-4"
            style="background-color: #efdada"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="mb-1 small fw-medium">Total Customers</p>
                <h4 class="fw-bold mb-0" th:text="${totalCustomers}">0</h4>
              </div>
              <i class="bi bi-hand-thumbs-up fs-4"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div
            class="card border-0 shadow-sm p-4 rounded-4"
            style="background-color: #dee0ef"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="mb-1 small fw-medium">Total Vehicles</p>
                <h4 class="fw-bold mb-0" th:text="${totalCars}">0</h4>
              </div>
              <i class="bi bi-people fs-4"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-12">
          <div class="card border-0 shadow-sm p-4 rounded-5 bg-white">
            <h5 class="fw-bold mb-4">Activities</h5>
            <div style="height: 300px"><canvas id="revenueChart"></canvas></div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card border-0 shadow-sm p-4 rounded-5 bg-white">
            <h5 class="fw-bold mb-4">Booking Status</h5>
            <div style="height: 250px">
              <canvas id="statusPieChart"></canvas>
            </div>
            <div class="mt-4 px-2">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="small"
                  ><i
                    class="bi bi-circle-fill text-success me-2"
                    style="color: #98d89e !important"
                  ></i
                  >Confirmed</span
                >
                <span class="fw-bold" th:text="${approvedCount}">0</span>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <span class="small"
                  ><i
                    class="bi bi-circle-fill text-warning me-2"
                    style="color: #f6dc7d !important"
                  ></i
                  >Pending</span
                >
                <span class="fw-bold" th:text="${pendingCount}">0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
         document.addEventListener("DOMContentLoaded", function() {
      new Chart(document.getElementById('revenueChart'), {
          type: 'line',
          data: {
              labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
              datasets: [{
                  label: 'Revenue',
                  data: [[${weeklyRevenue}]], // Real data from controller
                  borderColor: '#EE8484',
                  backgroundColor: 'rgba(238, 132, 132, 0.1)',
                  tension: 0.4,
                  fill: true,
                  borderWidth: 3
              }]
          },
          options: {
              maintainAspectRatio: false,
              plugins: { legend: { display: false } }
          }
      });

              // Booking Status Pie Chart
              new Chart(document.getElementById('statusPieChart'), {
                  type: 'pie',
                  data: {
                      labels: ['Confirmed', 'Pending'],
                      datasets: [{
                          data: [ [[${approvedCount}]], [[${pendingCount}]] ],
                          backgroundColor: ['#98D89E', '#F6DC7D'],
                          borderWidth: 0
                      }]
                  },
                  options: {
                      maintainAspectRatio: false,
                      plugins: { legend: { display: false } }
                  }
              });
          });
    </script>
  </section>
</html>
