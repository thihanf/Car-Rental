<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/admin-layout :: layout(~{::section})}"
>
  <section>
    <div class="container-fluid mt-4">
      <h3 class="h3-title mb-4">Manage Bookings</h3>

      <div class="card shadow-sm rounded-lg mb-3 border-0">
        <div class="card-body p-3">
          <div class="row g-3 align-items-end">
            <div class="col-lg-6 col-md-6">
              <label class="text-body-secondary">Search Booking</label>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by car model or customer name..."
                onkeyup="applyBookingFilters()"
              />
            </div>
            <div class="col-lg-5 col-md-6">
              <label class="text-body-secondary">Booking Status</label>
              <select
                id="statusFilter"
                class="form-control"
                onchange="applyBookingFilters()"
              >
                <option value="">All</option>
                <option value="PENDING">Pending</option>
                <option value="CONFIRMED">Confirmed</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <table
            class="table table-borderless align-middle mb-0"
            style="border-collapse: separate; border-spacing: 0 10px"
          >
            <thead>
              <tr class="bg-dark text-white">
                <th class="ps-4">ID</th>
                <th>Vehicle</th>
                <th>Dates</th>
                <th>Total Price</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>

            <tbody id="bookingTable">
              <tr th:each="booking : ${bookings}" class="bg-light shadow-sm">
                <td
                  class="ps-4 rounded-start fw-medium"
                  th:text="${booking.bookingId}"
                >
                  12
                </td>
                <td th:text="${booking.car.brand + ' ' + booking.car.model}">
                  Toyota Prius
                </td>

                <td style="font-size: 0.85rem">
                  <span
                    th:text="${#temporals.format(booking.startDate, 'dd MMM yyyy')}"
                  ></span>
                  <br />
                  <small class="text-muted">to</small>
                  <span
                    th:text="${#temporals.format(booking.endDate, 'dd MMM yyyy')}"
                  ></span>
                </td>

                <td
                  class="fw-bold text-primary"
                  th:text="'Rs ' + ${booking.totalPrice}"
                >
                  Rs 1200.00
                </td>

                <td>
                  <span
                    class="badge"
                    th:classappend="${booking.bookingStatus.name() == 'CONFIRMED' ? 'bg-success' : 
                                     (booking.bookingStatus.name() == 'PENDING' ? 'bg-warning text-dark' : 'bg-danger')}"
                    th:text="${booking.bookingStatus}"
                  >
                    PENDING
                  </span>
                </td>

                <td class="rounded-end text-center">
                  <form
                    th:if="${booking.bookingStatus.name() == 'PENDING'}"
                    th:action="@{/admin/bookings/approve/{id}(id=${booking.bookingId})}"
                    method="POST"
                    style="display: inline"
                  >
                    <button
                      type="submit"
                      class="btn btn-success btn-sm px-3 rounded-pill"
                    >
                      Approve
                    </button>
                  </form>
                  <span
                    th:unless="${booking.bookingStatus.name() == 'PENDING'}"
                    class="text-muted small"
                  >
                    No Actions
                  </span>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="d-flex justify-content-center mt-3">
            <button
              id="bookingToggleBtn"
              class="btn btn-outline-secondary btn-sm"
              onclick="toggleBookingRows()"
            >
              Show More
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</html>
