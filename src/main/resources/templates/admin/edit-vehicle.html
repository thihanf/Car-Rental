<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/admin-layout :: layout(~{::section})}"
>
  <section>
    <div class="container mt-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-white border-0">
          <h5 class="mb-0 fw-semibold">Edit Vehicle</h5>
        </div>

        <div class="card-body">
          <form
            th:action="@{/admin/vehicles/update}"
            th:object="${vehicle}"
            method="post"
            enctype="multipart/form-data"
          >
            <!-- Hidden ID -->
            <input type="hidden" th:field="*{carId}" />

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Brand</label>
                <input type="text" class="form-control" th:field="*{brand}" />
              </div>

              <div class="col-md-4">
                <label class="form-label">Model</label>
                <input type="text" class="form-control" th:field="*{model}" />
              </div>

              <div class="col-md-4">
                <label class="form-label">Type</label>
                <input type="text" class="form-control" th:field="*{type}" />
              </div>

              <div class="col-md-4">
                <label class="form-label">Rent Price</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  th:field="*{rentPrice}"
                />
              </div>

              <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                  <option value="AVAILABLE">Available</option>
                  <option value="BOOKED">Booked</option>
                  <option value="MAINTENANCE">Maintenance</option>
                </select>
              </div>

              <div class="col-md-4 d-flex align-items-center">
                <div class="form-check mt-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    th:field="*{airConditioner}"
                    id="acCheck"
                  />
                  <label class="form-check-label" for="acCheck">
                    Air Conditioner
                  </label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-center mt-4">
              <button type="submit" class="btn btn-primary px-4">
                Update Vehicle
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</html>
