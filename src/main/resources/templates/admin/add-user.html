<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Add User</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-white border-0">
          <h2 class="h2-title mb-0 fw-semibold">Add New User</h2>
        </div>

        <div class="card-body">
          <form
            th:action="@{/admin/users/add}"
            th:object="${user}"
            method="post"
          >
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Username</label>
                <input
                  type="text"
                  th:field="*{username}"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-12">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  th:field="*{email}"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-12">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phoneNo}" class="form-control" />
              </div>

              <div class="col-12">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  th:field="*{password}"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-12">
                <label class="form-label">Role</label>
                <select th:field="*{role}" class="form-select">
                  <option
                    th:each="r : ${roles}"
                    th:value="${r}"
                    th:text="${r}"
                  ></option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-center mt-4">
              <button type="submit" class="btn btn-primary px-5">
                Save User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
