<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout/admin-layout :: layout(~{::section})}"
>
  <section>
    <div class="container-fluid mt-4">
      <h3 class="h3-title mb-4">Vehicles</h3>
      <!-- ================= HEADER ================= -->
      <div class="card shadow-sm rounded-lg mb-3 border-0">
        <div class="card-body p-3">
          <div class="row g-3 align-items-end">
            <!-- Customer -->
            <div class="col-lg-6 col-md-6">
              <label class="text-body-secondary">Vehicles</label>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search vehicles..."
                onkeyup="applyVehicleFilters()"
              />
            </div>

            <!-- Status -->
            <div class="col-lg-3 col-md-6">
              <label class="text-body-secondary">Status</label>
              <select
                id="statusFilter"
                class="form-control"
                onchange="applyVehicleFilters()"
              >
                <option value="">All</option>
                <option value="AVAILABLE">Available</option>
                <option value="BOOKED">Booked</option>
                <option value="MAINTENANCE">Maintenance</option>
              </select>
            </div>

            <!-- Buttons -->
            <div class="col-lg-3 d-flex gap-2 justify-content-end">
              <a th:href="@{/admin/vehicles/add}" class="btn btn-add">
                + Add Vehicle
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= TABLE CARD ================= -->
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-3">
          <table
            class="table table-borderless align-middle mb-0"
            style="border-collapse: separate; border-spacing: 0 10px"
          >
            <thead>
              <tr class="bg-dark text-white">
                <th class="ps-4">Brand</th>
                <th>Model</th>
                <th>Type</th>
                <th>Rent Price</th>
                <th>Status</th>
                <th class="pe-4 text-center">Actions</th>
              </tr>
            </thead>

            <tbody id="vehicleTable">
              <tr
                th:each="car : ${vehicles}"
                class="bg-light rounded-3 shadow-sm"
              >
                <td class="ps-4 fw-medium" th:text="${car.brand}">Toyota</td>
                <td th:text="${car.model}">Corolla</td>
                <td th:text="${car.type}">Sedan</td>
                <td>Rs.<span th:text="${car.rentPrice}">0.00</span></td>

                <td>
                  <span
                    class="badge rounded-pill px-3 py-2 text-uppercase status-badge"
                    th:classappend="
                      ${#strings.toUpperCase(car.status) == 'AVAILABLE'} ? ' status-available' :
                      (${#strings.toUpperCase(car.status) == 'BOOKED'} ? ' status-booked' :
                      ' status-maintenance')"
                    th:text="${#strings.toUpperCase(car.status)}"
                  >
                    AVAILABLE
                  </span>
                </td>

                <td class="text-center pe-4">
                  <a
                    th:href="@{/admin/vehicles/edit/{id}(id=${car.carId})}"
                    class="btn btn-sm btn-outline-primary me-1"
                  >
                    Edit
                  </a>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(vehicles)}">
                <td colspan="6" class="text-center text-muted py-4">
                  No vehicles found
                </td>
              </tr>
            </tbody>
          </table>
          <div class="d-flex justify-content-center mt-3">
            <button
              id="toggleRowsBtn"
              class="btn btn-outline-secondary btn-sm"
              onclick="toggleRows()"
            >
              Show More
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</html>
