<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Add Vehicle</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-white border-0">
          <h2 class="h2-title mb-0 fw-semibold">Add New Vehicle</h2>
        </div>

        <div class="card-body">
          <form
            th:action="@{/admin/vehicles/add}"
            method="post"
            enctype="multipart/form-data"
          >
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Brand</label>
                <input type="text" name="brand" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Model</label>
                <input type="text" name="model" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Type</label>
                <input type="text" name="type" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Rent Price (per day)</label>
                <input
                  type="number"
                  name="rentPrice"
                  step="0.01"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                  <option value="AVAILABLE">Available</option>
                  <option value="BOOKED">Booked</option>
                  <option value="MAINTENANCE">Maintenance</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Transmission</label>
                <select name="transmission" class="form-select">
                  <option>Automatic</option>
                  <option>Manual</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Fuel Type</label>
                <select name="fuelType" class="form-select">
                  <option>Petrol</option>
                  <option>Diesel</option>
                </select>
              </div>

              <div class="col-md-4 d-flex align-items-center">
                <div class="form-check mt-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="airConditioner"
                    value="true"
                    id="acCheck"
                  />
                  <label class="form-check-label" for="acCheck">
                    Air Conditioner
                  </label>
                </div>
              </div>

              <div class="col-md-4">
                <label class="form-label">Vehicle Image</label>
                <input type="file" name="image" class="form-control" required />
              </div>
            </div>

            <div class="d-flex justify-content-center mt-4 gap-2">
              <button type="submit" class="btn btn-primary">
                Save Vehicle
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
