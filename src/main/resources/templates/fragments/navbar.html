<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <section class="site-navbar" th:fragment="navbar">
      <div class="content-width">
        <nav class="navbar navbar-expand-lg custom-navbar">
          <div class="container-fluid align-items-center">
            <!-- Logo -->
            <a
              class="navbar-brand d-flex align-items-center gap-2"
              th:href="@{/}"
            >
              <span class="h3-title">Rent & go.</span>
            </a>

            <!-- Toggler -->
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#mainNavbar"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div
              class="collapse navbar-collapse justify-content-center"
              id="mainNavbar"
            >
              <ul class="navbar-nav gap-lg-4">
                <li class="nav-item">
                  <a class="nav-link active" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" th:href="@{/gallery}">Vehicles</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" th:href="@{/about}">About Us</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" th:href="@{/contact}">Contact Us</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </section>
  </body>
</html>
