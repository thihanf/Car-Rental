<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>
  <body>
    <section class="sign-up">
      <div class="auth-wrapper">
        <!-- LEFT PANEL -->
        <div class="auth-left">
          <h1>Rent & go.</h1>
        </div>

        <!-- RIGHT PANEL -->
        <div class="auth-right">
          <div class="auth-card">
            <h3 class="h3-title-form-title f-title">Sign Up</h3>

            <form th:action="@{/signup}" method="post">
              <div class="row">
                <input
                  type="text"
                  name="firstName"
                  placeholder="First Name"
                  required
                />
                <input
                  type="text"
                  name="lastName"
                  placeholder="Last Name"
                  required
                />
              </div>

              <input
                type="text"
                name="username"
                placeholder="Username"
                required
              />

              <input
                type="email"
                name="email"
                placeholder="Email address"
                required
              />

              <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required
              />

              <input
                type="password"
                name="password"
                placeholder="Password"
                required
              />

              <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="footer-text">
              Already have an account?
              <a th:href="@{/login}">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
