<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <section class="car-details">
      <div class="content-width">
        <div class="main_container">
          <div class="left_container">
            <h2 class="h2-title" th:text="${selectedCar.brand}">BMW</h2>
            <div class="p-price-tag font-price">
              Rs <span th:text="${selectedCar.rentPrice}">25</span> /
              <span class="p-body-text-gray">day</span>
            </div>

            <div class="image-wrap">
              <picture class="picture">
                <source th:srcset="${selectedCar.imageUrl}" />
                <img
                  class="image car-image"
                  th:src="${selectedCar.imageUrl}"
                  alt="Car image"
                />
              </picture>
            </div>
          </div>

          <div class="right_container">
            <h3 class="h3-title">Technical Specification</h3>

            <div class="spec">
              <div class="spec-box">
                <img
                  th:src="@{/icons/car-details/gear.svg}"
                  width="24"
                  height="24"
                  class="feature-icon"
                />
                <p class="p-body-text bold-text">Gear Box</p>
                <p
                  class="p-body-text-gray"
                  th:text="${selectedCar.transmission}"
                >
                  Automatic
                </p>
              </div>

              <div class="spec-box">
                <img
                  th:src="@{/icons/car-details/fuel.svg}"
                  width="24"
                  height="24"
                  class="feature-icon"
                />
                <p class="p-body-text bold-text">Fuel</p>
                <p class="p-body-text-gray" th:text="${selectedCar.fuelType}">
                  Petrol
                </p>
              </div>

              <div class="spec-box">
                <img
                  th:src="@{/icons/car-details/air-conditinoer.svg}"
                  width="24"
                  height="24"
                  class="feature-icon"
                />
                <p class="p-body-text bold-text">Air Conditioner</p>
                <p
                  class="p-body-text-gray"
                  th:text="${selectedCar.airConditioner ? 'Yes' : 'No'}"
                >
                  Yes
                </p>
              </div>

              <div class="spec-box">
                <img
                  th:src="@{/icons/car-details/seat.svg}"
                  width="24"
                  height="24"
                  class="feature-icon"
                />
                <p class="p-body-text bold-text">Seats</p>
                <p class="p-body-text-gray" th:text="${selectedCar.seats}">5</p>
              </div>
            </div>

            <div class="button-wrap">
              <form th:action="@{/book}" method="POST">
                <input
                  type="hidden"
                  name="id"
                  th:value="${selectedCar.carId}"
                />

                <input
                  type="hidden"
                  name="rentalDate"
                  th:value="${startDate}"
                />
                <input type="hidden" name="returnDate" th:value="${endDate}" />

                <button type="submit" class="btn-primary car-btn">
                  Confirm & Book Now
                </button>
              </form>
            </div>
          </div>
        </div>
        <h2 class="h2-title">Other cars</h2>
      </div>
    </section>
    <section class="car-details-gallery">
      <div class="content-width">
        <div class="wrap-all">
          <div class="inner-wrap">
            <div class="vehicle-grid">
              <div
                th:each="car, stat : ${cars}"
                th:if="${cars != null and stat.index < 6}"
              >
                <div
                  th:replace="~{fragments/car-card :: carCard(${car}, ${startDate}, ${endDate})}"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div th:replace="~{fragments/footer :: footer-fragment}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
